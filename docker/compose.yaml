services:
  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: ecommerce-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    volumes:
      - mailpit-data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000

volumes:
  mailpit-data:
