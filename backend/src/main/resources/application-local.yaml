
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_db
    username: ${ECOMMERCE_DB_USERNAME:ecommerce_app}
    password: ${ECOMMERCE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    user: ${ECOMMERCE_MIGRATION_USERNAME:ecommerce_migration}
    password: ${ECOMMERCE_MIGRATION_PASSWORD}

  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

logging:
  level:
    com.ecommerce: DEBUG
