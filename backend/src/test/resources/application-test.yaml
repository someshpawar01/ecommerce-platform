spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_test
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET time_zone = '+00:00'

  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:mysql://localhost:3306/ecommerce_test
    user: ${TEST_FLYWAY_USERNAME}
    password: ${TEST_FLYWAY_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

app:
  mail:
    from: no-reply@ecommerce.local
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  verification:
    token-expiry: 24h
    base-url: http://localhost:5173
    resend-cooldown: 60s
    max-tokens-per-day: 5
  password-reset:
    token-expiry: 15m
    base-url: http://localhost:5173/reset-password
  security:
    jwt:
      issuer: ecommerce-platform
      audience: ecommerce-api
      access-token-minutes: 15
      key-id: ecommerce-rs256-v1
      private-key: file:${JWT_PRIVATE_KEY_PATH}
      public-key: file:${JWT_PUBLIC_KEY_PATH}
    cookie:
      secure: false
